<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>AirPad Remote</title>
<link rel="stylesheet" href="/style.css">
<style>
html,body{height:100%}
body{margin:0;user-select:none;-webkit-user-select:none;touch-action:none;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;gap:8px;padding:max(8px,env(safe-area-inset-top)) 8px max(8px,env(safe-area-inset-bottom))}
#top{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 10px;flex-wrap:wrap}
#top h1{margin:0;font-size:16px;color:#fff;font-weight:700}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tool{padding:6px 10px;font-size:12px;border-radius:12px}
#main{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
#stage{flex:0 0 36vh;display:flex;min-width:0;min-height:0}
#view{flex:1;min-width:0;min-height:0;overflow:hidden;display:flex;border-radius:18px;background:#000;position:relative}
canvas{width:100%;height:100%;object-fit:contain;display:block;transform-origin:center;outline:none}
canvas:focus-visible{box-shadow:inset 0 0 0 2px var(--acc)}
#rz{position:absolute;right:8px;top:8px;display:none;padding:6px 10px}
[data-tab=zoom] #rz{display:block}
#ctrl{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.panel{display:none;flex:1;min-height:0;padding:12px;gap:10px;flex-direction:column}
.panel.on{display:flex}
nav{display:flex;gap:6px;padding:6px}
nav button{flex:1;padding:10px 2px;font-size:13px;border-radius:14px}
#ov{position:fixed;inset:0;z-index:9;display:grid;place-items:center;text-align:center;padding:24px;margin:20px;border-radius:26px;
 background:rgba(8,12,40,.55)}
#ov.hide{display:none}
#pad{flex:1;border-radius:18px;background:rgba(255,255,255,.07);border:1px dashed rgba(255,255,255,.3);display:grid;place-items:center}
.row{display:flex;gap:8px}.row>*{flex:1}
#p-keys{overflow:auto;touch-action:pan-y}#p-keys>*{flex-shrink:0}
#kbd{display:flex;flex-direction:column;gap:5px}
#kbd button{padding:9px 0;font-size:12px;min-width:0;touch-action:manipulation}
textarea{width:100%;height:56px;border-radius:14px;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.3);color:#fff;padding:10px;font:inherit;user-select:text;-webkit-user-select:text;touch-action:auto}
#list{flex:1;overflow:auto;touch-action:pan-y}
.f{display:flex;justify-content:space-between;gap:8px;padding:11px 8px;border-bottom:1px solid rgba(255,255,255,.12)}
#game{position:relative;flex:1}
#game button{position:absolute;width:64px;height:64px;border-radius:50%;padding:0;font-weight:700}

/* layout by mode */
body:not(.split-tb):not(.split-lr)[data-tab=zoom] #stage{flex:1}
body:not(.split-tb):not(.split-lr)[data-tab=zoom] #ctrl{flex:0 0 auto}
body:not(.split-tb):not(.split-lr)[data-tab=zoom] .panel{display:none!important}
body:not(.split-tb):not(.split-lr):not(.desk)[data-tab=files] #stage{display:none}
body.desk #stage{flex:1}
body.desk[data-tab=files] #stage{flex:1 1 55%}
body.desk[data-tab=files] #ctrl{flex:1 1 45%}
body.desk[data-tab=zoom] #ctrl{flex:0 0 auto}
body.desk .panel:not(#p-files){display:none!important}
body.desk nav [data-tab=track],body.desk nav [data-tab=keys],body.desk nav [data-tab=game]{display:none}

/* split modes: the stage is the PC screen, #ctrl is the controller half */
body.split-tb #main{flex-direction:column}
body.split-tb #stage{flex:1 1 50%;margin-bottom:6px}       /* 6px hinge-safe gap */
body.split-tb #ctrl{flex:1 1 50%}
body.split-lr #main{flex-direction:row}
body.split-lr #stage{flex:1 1 50%;margin-right:6px}
body.split-lr #ctrl{flex:1 1 50%}
body.split-lr #stage,body.split-lr #ctrl{min-width:0}
</style></head>
<body data-tab="track">
<div id="app">
  <header id="top" class="glass">
    <h1>Airpad: Pc controller hub 🔥</h1>
    <div class="tools">
      <button id="desk" class="tool" title="Use this screen like a local mouse and keyboard">Desktop control</button>
      <button id="split" class="tool" title="Show the PC screen and controller side by side">Split</button>
      <button id="orient" class="tool" hidden>Top / Bottom</button>
      <button id="full" class="tool">Fullscreen</button>
    </div>
  </header>

  <div id="ov" class="glass"><div><b id="ovt">Connecting…</b><p class="dim" id="ovs">Approve this phone on your PC screen.</p></div></div>

  <div id="main">
    <div id="stage"><div id="view"><canvas id="cv" tabindex="0" width="16" height="9"></canvas><button id="rz">Reset zoom</button></div></div>

    <div id="ctrl">
      <section class="panel glass" id="p-track">
        <div id="pad"><span class="dim">1 finger: move · tap: click · 2 fingers: scroll / right-click</span></div>
        <div class="row"><button data-b="left">Left</button><button data-b="right">Right</button><button id="drag">Drag lock</button></div>
        <label class="dim">Speed <input id="sens" type="range" min="1" max="5" step=".25" value="2.2" style="width:60%"></label>
      </section>

      <section class="panel glass" id="p-keys">
        <textarea id="live" placeholder="Type here: every character appears on the PC instantly"></textarea>
        <div id="kbd"></div>
        <div class="row"><button data-c="ctrl,c">Copy</button><button data-c="ctrl,v">Paste</button><button data-c="ctrl,z">Undo</button><button data-c="alt,tab">Alt+Tab</button><button data-k="cmd">Win</button></div>
      </section>

      <section class="panel glass" id="p-files">
        <div class="row"><button id="up">⬆ Up</button><button id="uplbl">Upload to PC</button></div>
        <input id="file" type="file" multiple hidden>
        <div class="dim" id="cwd">/</div><div id="list"></div><div class="dim" id="msg"></div>
      </section>

      <section class="panel glass" id="p-game"><div id="game"></div></section>

      <nav class="glass">
        <button data-tab="track" class="on">Trackpad</button><button data-tab="zoom">Zoom</button>
        <button data-tab="keys">Keys</button><button data-tab="files">Files</button><button data-tab="game">Gamepad</button>
      </nav>
    </div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws/phone?s='+new URLSearchParams(location.search).get('s'));
const send=o=>ws.readyState===1&&ws.send(JSON.stringify(o));
const buzz=()=>navigator.vibrate&&navigator.vibrate(8);
let tab='track',ctl='track',cwd='',split=false,orient='tb',autoSplit=false,deskMode=false;

/* ---- connection + screen ---- */
const cv=$('#cv'),cx=cv.getContext('2d');
ws.onmessage=async e=>{
  if(e.data instanceof Blob){const b=await createImageBitmap(e.data);
    if(cv.width!==b.width){cv.width=b.width;cv.height=b.height}cx.drawImage(b,0,0);b.close();send({t:'ack'});return}
  const d=JSON.parse(e.data);
  if(d.t==='ready'){$('#ov').classList.add('hide');ls('')}
  if(d.t==='wait'){$('#ovt').textContent='Waiting for approval…'}
  if(d.t==='denied'){$('#ov').classList.remove('hide');$('#ovt').textContent='Denied by the PC';$('#ovs').textContent='Reload this page to ask again.'}
  if(d.t==='ls')render(d);
  if(d.t==='chunk')gotChunk(d);
  if(d.t==='put'){$('#msg').textContent='Uploaded '+d.name;ls(cwd)}
  if(d.t==='err')$('#msg').textContent='Error: '+d.m;
};
ws.onclose=()=>{releaseAllKeys();$('#ov').classList.remove('hide');$('#ovt').textContent='Disconnected';$('#ovs').textContent='Reload this page to reconnect.'};

/* ---- tabs and layout ---- */
function resetZoom(){z=1;tx=ty=0;apply()}
function setTab(t){
  const prev=tab;tab=t;document.body.dataset.tab=t;
  if(t!=='zoom'&&t!=='files')ctl=t;               // last controller panel stays visible beside the zoomed screen
  if(prev==='zoom'&&t!=='zoom')resetZoom();
  const show=t==='zoom'?ctl:t;
  $$('nav [data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  $$('.panel').forEach(p=>p.classList.toggle('on',p.id==='p-'+show));
}
$$('nav [data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));

function applySplit(){
  const b=document.body.classList;
  b.toggle('split-tb',split&&orient==='tb');b.toggle('split-lr',split&&orient==='lr');
  $('#split').classList.toggle('on',split);
  $('#orient').hidden=!split;
  $('#orient').textContent=orient==='tb'?'Top / Bottom':'Left / Right';
  setTab(tab);
}
$('#split').onclick=()=>{split=!split;autoSplit=false;applySplit()};
$('#orient').onclick=()=>{orient=orient==='tb'?'lr':'tb';applySplit()};
// Foldable postures: vertical segments = fold runs across the screen (tent/flex), horizontal = book mode.
const segV=matchMedia('(vertical-viewport-segments: 2)'),segH=matchMedia('(horizontal-viewport-segments: 2)');
function autoPosture(){
  if(segV.matches||segH.matches){split=true;orient=segV.matches?'tb':'lr';autoSplit=true}
  else if(autoSplit){split=false;autoSplit=false}
  else return;
  applySplit();
}
segV.addEventListener?.('change',autoPosture);segH.addEventListener?.('change',autoPosture);

function setDesk(on){
  deskMode=on;document.body.classList.toggle('desk',on);$('#desk').classList.toggle('on',on);
  if(on){resetZoom();setTab('zoom')}else{releaseAllKeys();setTab('track')}
}
$('#desk').onclick=()=>setDesk(!deskMode);

const full=$('#full');
if(!document.documentElement.requestFullscreen)full.hidden=true;
full.onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();

/* ---- trackpad ---- */
const cen=t=>{let x=0,y=0;for(const p of t){x+=p.clientX;y+=p.clientY}return[x/t.length,y/t.length]};
let px,py,t0,moved,fingers,sa=0,mvx=0,mvy=0,mvq=0;
const flushMv=()=>{mvq=0;send({t:'mv',dx:mvx,dy:mvy});mvx=mvy=0};
const pad=$('#pad'),opt={passive:false};
pad.addEventListener('touchstart',e=>{e.preventDefault();if(e.touches.length===1){t0=Date.now();moved=0;fingers=1}
  else fingers=Math.max(fingers,e.touches.length);[px,py]=cen(e.touches)},opt);
pad.addEventListener('touchmove',e=>{e.preventDefault();const[x,y]=cen(e.touches),dx=x-px,dy=y-py;px=x;py=y;moved+=Math.abs(dx)+Math.abs(dy);
  const sens=+$('#sens').value;
  if(e.touches.length===1){mvx+=dx*sens;mvy+=dy*sens;if(!mvq)mvq=requestAnimationFrame(flushMv)}
  else{sa+=dy/10;const n=Math.trunc(sa);if(n){send({t:'sc',dy:n});sa-=n}}},opt);
pad.addEventListener('touchend',e=>{e.preventDefault();
  if(!e.touches.length){if(Date.now()-t0<220&&moved<10)send({t:'click',b:fingers>1?'right':'left'});fingers=0}},opt);
$$('[data-b]').forEach(b=>b.onclick=()=>{buzz();send({t:'click',b:b.dataset.b})});
let dragging=false;$('#drag').onclick=e=>{dragging=!dragging;e.target.classList.toggle('on',dragging);send({t:'btn',b:'left',d:dragging?1:0})};

/* ---- zoom: pinch/pan the screen, tap to click where you tap (touch only) ---- */
let z=1,tx=0,ty=0,g={};
const apply=()=>cv.style.transform=`translate(${tx}px,${ty}px) scale(${z})`;
$('#rz').onclick=resetZoom;
const dist=t=>t.length<2?0:Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
const base=e=>g={t:Date.now(),m:g.m||0,d:dist(e.touches),z,c:cen(e.touches),tx,ty};
const view=$('#view'),zoomOn=()=>tab==='zoom'&&!deskMode;
view.addEventListener('touchstart',e=>{if(!zoomOn())return;e.preventDefault();if(e.touches.length===1)g={m:0};base(e)},opt);
view.addEventListener('touchmove',e=>{if(!zoomOn())return;e.preventDefault();const c=cen(e.touches);
  g.m+=Math.abs(c[0]-g.c[0])+Math.abs(c[1]-g.c[1])>0?1:0;
  if(e.touches.length===2)z=Math.min(6,Math.max(1,g.z*dist(e.touches)/g.d));
  tx=g.tx+c[0]-g.c[0];ty=g.ty+c[1]-g.c[1];apply()},opt);
view.addEventListener('touchend',e=>{if(!zoomOn())return;e.preventDefault();
  if(e.touches.length)return base(e);
  if(Date.now()-g.t<250&&g.m<4){const t=e.changedTouches[0],r=cv.getBoundingClientRect();
    send({t:'abs',fx:(t.clientX-r.left)/r.width,fy:(t.clientY-r.top)/r.height});send({t:'click',b:'left'})}},opt);

/* ---- desktop control: physical mouse and keyboard on the live screen ---- */
let lastMove=null,moveQ=0,wacc=0;
const pressed=new Set(),heldKeys=new Map();   // heldKeys: event.code -> key name sent to the PC
const BTNS={0:'left',1:'middle',2:'right'};
function screenPos(e){                         // maps a pointer position to 0..1 of the PC screen (object-fit: contain)
  if(!cv.width)return null;
  const r=cv.getBoundingClientRect(),sc=Math.min(r.width/cv.width,r.height/cv.height),w=cv.width*sc,h=cv.height*sc;
  const fx=(e.clientX-(r.left+(r.width-w)/2))/w,fy=(e.clientY-(r.top+(r.height-h)/2))/h;
  return{fx:Math.min(1,Math.max(0,fx)),fy:Math.min(1,Math.max(0,fy))};
}
const flushMove=()=>{moveQ=0;if(lastMove){send({t:'abs',...lastMove});lastMove=null}};
const isMouse=e=>deskMode&&e.pointerType==='mouse';
cv.addEventListener('pointermove',e=>{if(!isMouse(e))return;const p=screenPos(e);
  if(p){lastMove=p;if(!moveQ)moveQ=requestAnimationFrame(flushMove)}});
cv.addEventListener('pointerdown',e=>{if(!isMouse(e)||!BTNS[e.button])return;e.preventDefault();cv.focus();
  cv.setPointerCapture(e.pointerId);const p=screenPos(e);
  cancelAnimationFrame(moveQ);moveQ=0;lastMove=null;             // position first, then the press
  if(p)send({t:'abs',...p});
  pressed.add(BTNS[e.button]);send({t:'btn',b:BTNS[e.button],d:1})});
const release=e=>{if(!isMouse(e))return;const b=BTNS[e.button];
  if(pressed.has(b)){pressed.delete(b);send({t:'btn',b,d:0})}};
cv.addEventListener('pointerup',release);
cv.addEventListener('pointercancel',e=>{if(!isMouse(e))return;pressed.forEach(b=>send({t:'btn',b,d:0}));pressed.clear()});
cv.addEventListener('contextmenu',e=>{if(deskMode)e.preventDefault()});
cv.addEventListener('wheel',e=>{if(!deskMode)return;e.preventDefault();
  wacc+=-e.deltaY*(e.deltaMode===1?40:1)/40;const n=Math.trunc(wacc);if(n){send({t:'sc',dy:n});wacc-=n}},{passive:false});

const KEYMAP={Shift:'shift',Control:'ctrl',Alt:'alt',AltGraph:'alt',Meta:'cmd',OS:'cmd',Enter:'enter',Escape:'esc',
  Backspace:'backspace',Delete:'delete',Tab:'tab',CapsLock:'caps_lock',Home:'home',End:'end',PageUp:'page_up',
  PageDown:'page_down',Insert:'insert',PrintScreen:'print_screen',ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',
  ArrowRight:'right',' ':'space'};
function keyName(e){
  if(KEYMAP[e.key])return KEYMAP[e.key];
  if(/^F([1-9]|1[0-2])$/.test(e.key))return e.key.toLowerCase();
  if(e.key.length===1)return e.key;              // letters, digits and symbols are typed as the character
  return null;
}
function releaseAllKeys(){
  heldKeys.forEach(n=>send({t:'key',k:n,d:0}));heldKeys.clear();
  pressed.forEach(b=>send({t:'btn',b,d:0}));pressed.clear();
}
window.addEventListener('keydown',e=>{
  if(!deskMode||document.activeElement!==cv)return;
  e.preventDefault();                            // stop browser shortcuts, Tab focus moves and page scrolling
  if(e.repeat)return;
  const n=keyName(e);if(!n||heldKeys.has(e.code))return;
  heldKeys.set(e.code,n);send({t:'key',k:n,d:1});
});
window.addEventListener('keyup',e=>{
  if(!heldKeys.has(e.code))return;
  e.preventDefault();const n=heldKeys.get(e.code);heldKeys.delete(e.code);send({t:'key',k:n,d:0});
});
window.addEventListener('blur',releaseAllKeys);     // nothing stays stuck on the PC if focus leaves
cv.addEventListener('blur',releaseAllKeys);

/* ---- keyboard (phone) ---- */
$('#live').addEventListener('input',e=>{
  if(e.inputType==='insertText'&&e.data)send({t:'text',s:e.data});
  else if(e.inputType==='insertLineBreak')send({t:'key',k:'enter',d:2});
  else if(e.inputType==='deleteContentBackward')send({t:'key',k:'backspace',d:2});
  else if(e.inputType==='insertFromPaste'&&e.data)send({t:'text',s:e.data});
  if($('#live').value.length>200)$('#live').value=''});
const ROWS=[
 ['esc','f1','f2','f3','f4','f5','f6','f7','f8','f9','f10','f11','f12'],
 [...'`1234567890-=','backspace'],
 ['tab',...'qwertyuiop[]\\'],
 ['caps_lock',...'asdfghjkl;\'','enter'],
 ['shift',...'zxcvbnm,./','up'],
 ['ctrl','cmd','alt','space','left','down','right','delete'],
 ['home','end','page_up','page_down','insert','print_screen']];
const MOD=new Set(['shift','ctrl','alt','cmd']),mods=new Set();
const LBL={backspace:'⌫',enter:'⏎',up:'↑',down:'↓',left:'←',right:'→',cmd:'Win',space:'Space',caps_lock:'Caps',page_up:'PgUp',page_down:'PgDn',print_screen:'PrtSc'};
ROWS.forEach(r=>{const d=document.createElement('div');d.className='row';d.style.gap='4px';
  r.forEach(k=>{const b=document.createElement('button');b.textContent=LBL[k]||(k.length>1?k[0].toUpperCase()+k.slice(1):k);
    if(k==='space')b.style.flex='4';
    b.onclick=()=>{buzz();
      if(MOD.has(k)){mods.has(k)?mods.delete(k):mods.add(k);b.classList.toggle('on');return}
      mods.size?send({t:'combo',k:[...mods,k]}):send({t:'key',k,d:2});
      mods.clear();$$('#kbd .on').forEach(x=>x.classList.remove('on'))};
    d.append(b)});
  $('#kbd').append(d)});
$$('[data-k]').forEach(b=>b.onclick=()=>{buzz();send({t:'key',k:b.dataset.k,d:2})});
$$('[data-c]').forEach(b=>b.onclick=()=>{buzz();send({t:'combo',k:b.dataset.c.split(',')})});

/* ---- cloud storage ---- */
const ls=p=>{cwd=p;$('#cwd').textContent='/'+p;send({t:'ls',path:p})};
const fmt=n=>n>1e9?(n/1e9).toFixed(1)+' GB':n>1e6?(n/1e6).toFixed(1)+' MB':Math.ceil(n/1e3)+' KB';
function render(d){const l=$('#list');l.textContent='';
  for(const i of d.items){const r=document.createElement('div');r.className='f';
    r.innerHTML='<span></span><span class="dim"></span>';r.firstChild.textContent=(i.d?'📁 ':'📄 ')+i.n;r.lastChild.textContent=i.d?'':fmt(i.s);
    r.onclick=()=>{const p=(cwd?cwd+'/':'')+i.n;if(i.d)ls(p);else{$('#msg').textContent='Downloading '+i.n+'…';send({t:'get',path:p})}};l.append(r)}}
$('#up').onclick=()=>ls(cwd.split('/').slice(0,-1).join('/'));
$('#uplbl').onclick=()=>$('#file').click();
const dl={};
function gotChunk(d){(dl[d.name]??=[]).push(Uint8Array.from(atob(d.b),c=>c.charCodeAt(0)));
  if(d.last){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(dl[d.name]));a.download=d.name;a.click();
    delete dl[d.name];$('#msg').textContent='Saved '+d.name}}
const b64=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.readAsDataURL(b)});
$('#file').onchange=async e=>{for(const f of e.target.files){const C=192*1024,n=Math.max(1,Math.ceil(f.size/C));
  for(let i=0;i<n;i++){while(ws.bufferedAmount>1e6)await new Promise(r=>setTimeout(r,30));
    send({t:'put',path:cwd,name:f.name,i,last:i===n-1,b:await b64(f.slice(i*C,(i+1)*C))});
    $('#msg').textContent=`Uploading ${f.name} ${Math.round((i+1)/n*100)}%`}}e.target.value=''};

/* ---- gamepad: edit this map to match your game ---- */
const PAD={dpad:{'▲':'w','◀':'a','▼':'s','▶':'d'},face:{A:'k',B:'l',X:'j',Y:'i'},mid:{Select:'tab',Start:'enter'},sh:{L:'q',R:'e'}};
const gm=$('#game');
function pbtn(label,k,x,y,w){const b=document.createElement('button');b.textContent=label;b.style.cssText=`left:${x};top:${y}`;if(w)b.style.width=w,b.style.borderRadius='22px';
  const dn=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);b.classList.add('on');buzz();send({t:'key',k,d:1})};
  const up=e=>{b.classList.remove('on');send({t:'key',k,d:0})};
  b.onpointerdown=dn;b.onpointerup=up;b.onpointercancel=up;b.oncontextmenu=e=>e.preventDefault();gm.append(b)}
const D=Object.entries(PAD.dpad),dp=[['5%','0%'],['0%','38%'],['5%','76%'],['26%','38%']];
D.forEach(([l,k],i)=>pbtn(l,k,`calc(${dp[i][0]} + 40px)`,`calc(${dp[i][1]} - 0px)`));
Object.entries(PAD.face).forEach(([l,k],i)=>pbtn(l,k,`calc(100% - ${[90,150,90,30][i]}px - 40px)`,['0%','38%','76%','38%'][i]));
Object.entries(PAD.mid).forEach(([l,k],i)=>pbtn(l,k,`calc(50% - 90px + ${i*100}px)`,'60%','80px'));
Object.entries(PAD.sh).forEach(([l,k],i)=>pbtn(l,k,i?'calc(100% - 90px)':'10px','-4px','80px'));

/* ---- start ---- */
setTab('track');
autoPosture();
setDesk(matchMedia('(pointer:fine)').matches&&!matchMedia('(pointer:coarse)').matches);
</script></body></html>
